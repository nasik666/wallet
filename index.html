<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Кошелёк</title>
  <meta name="description" content="Простой учёт расходов, доходов, долгов и вкладов">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кошелёк">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-startup-image" href="icons/splash-light.png" media="(prefers-color-scheme: light) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-dark.png" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Разделы">
      <button type="button" class="tab" data-act="tab" data-tab="home" data-icon="home"><span>Главная</span></button>
      <button type="button" class="tab" data-act="tab" data-tab="stats" data-icon="stats"><span>Статистика</span></button>
      <button type="button" class="tab-add" data-act="add" data-icon="plus" aria-label="Добавить расход или доход"></button>
      <button type="button" class="tab" data-act="tab" data-tab="debts" data-icon="debts"><span>Долги</span></button>
      <button type="button" class="tab" data-act="tab" data-tab="deposits" data-icon="bank"><span>Вклады</span></button>
    </nav>
  </div>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Для работы приложения нужен JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
